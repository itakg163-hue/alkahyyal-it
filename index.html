@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

@keyframes akitToastIn{
  from{ transform:translateX(120%); opacity:0; }
  to{ transform:translateX(0); opacity:1; }
}
.akit-toast-container{
  position:fixed; top:18px; right:18px; z-index:9999;
  display:flex; flex-direction:column; gap:10px;
  width:300px; max-width:calc(100vw - 36px);
}
.akit-toast{
  background:#F7F9FC; border:1px solid #3C7DD9; border-left:5px solid #C99A32;
  border-radius:10px; padding:12px 14px; cursor:pointer;
  box-shadow:0 8px 24px rgba(20,30,50,0.25);
  font-family:'IBM Plex Sans',sans-serif;
  animation: akitToastIn 0.35s ease-out;
  position:relative;
}
.akit-toast-title{
  font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px;
  color:#C99A32; margin-bottom:6px; letter-spacing:.3px;
}
.akit-toast-body{ font-size:13px; color:#1B2635; line-height:1.5; }
.akit-toast-close{
  position:absolute; top:6px; right:10px; color:#748099; font-size:14px; cursor:pointer;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;}
.app{min-height:100vh;display:flex;flex-direction:column;}

/* Top bar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--panel-2),var(--bg));
}
.brand{display:flex;align-items:center;gap:10px;}
.bg-watermark{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:var(--logo-url);
  background-repeat:no-repeat;background-position:center 55%;background-size:520px;
  opacity:0.06;
}
.header-logo{height:40px;width:auto;display:block;}
.app,.topbar,.content{position:relative;z-index:1;}
.brand-name{font-family:'IBM Plex Mono';font-weight:600;letter-spacing:0.3px;font-size:14px;line-height:1.3;max-width:340px;}
.brand-sub{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono';margin-top:2px;}

.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px;}
.tab{
  padding:8px 18px;border-radius:6px;font-family:'IBM Plex Mono';font-size:13px;font-weight:500;
  color:var(--muted);cursor:pointer;user-select:none;transition:.15s;
}
.tab.active{background:var(--amber);color:#1a1200;}
.tab:hover:not(.active){color:var(--text);}

.stats{display:flex;gap:18px;}
.stat{text-align:right;}
.stat-num{font-family:'IBM Plex Mono';font-size:20px;font-weight:700;line-height:1;}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px;}

/* Body */
.content{flex:1;padding:24px;max-width:1400px;width:100%;margin:0 auto;}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;}
.search-box{
  flex:1;max-width:340px;background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:9px 14px;color:var(--text);font-family:'IBM Plex Sans';font-size:13px;
}
.search-box:focus{outline:none;border-color:var(--amber);}
.btn{
  font-family:'IBM Plex Mono';font-weight:600;font-size:13px;border:none;border-radius:8px;
  padding:10px 18px;cursor:pointer;transition:.15s;
}
.btn-primary{background:var(--amber);color:#1a1200;}
.btn-primary:hover{background:#e0b752;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:var(--muted);}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media(max-width:1000px){.board{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.board{grid-template-columns:1fr;}}

.col{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px;min-height:200px;}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px;}
.col-title{font-family:'IBM Plex Mono';font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;}
.col-count{
  font-family:'IBM Plex Mono';font-size:11px;background:var(--panel);border:1px solid var(--border);
  border-radius:20px;padding:2px 9px;color:var(--muted);
}
.col[data-status="Open"] .col-title{color:var(--blue);}
.col[data-status="In Progress"] .col-title{color:var(--amber);}
.col[data-status="Resolved"] .col-title{color:var(--mint);}
.col[data-status="Closed"] .col-title{color:var(--muted);}

/* Ticket stub — signature element */
.stub{
  position:relative;background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:14px 14px 14px 22px;margin-bottom:12px;cursor:pointer;transition:.15s;
  border-left:3px solid var(--blue);
}
.stub:hover{border-color:var(--muted);transform:translateX(2px);}
.stub[data-priority="Critical"]{border-left-color:var(--danger);}
.stub[data-priority="High"]{border-left-color:var(--amber);}
.stub[data-priority="Medium"]{border-left-color:var(--blue);}
.stub[data-priority="Low"]{border-left-color:var(--muted);}
/* perforation notches */
.stub::before,.stub::after{
  content:'';position:absolute;left:-1px;width:10px;height:10px;background:var(--bg);
  border:1px solid var(--border);border-radius:50%;
}
.stub::before{top:-6px;}
.stub::after{bottom:-6px;}
.stub-num{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);letter-spacing:0.5px;}
.stub-title{font-size:13.5px;font-weight:600;margin:5px 0 8px;line-height:1.35;}
.stub-meta{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  font-family:'IBM Plex Mono';font-size:10px;padding:3px 8px;border-radius:5px;
  border:1px solid var(--border);color:var(--muted);
}
.chip.priority-Critical{color:var(--danger);border-color:var(--danger);}
.chip.priority-High{color:var(--amber);border-color:var(--amber);}
.chip.priority-Medium{color:var(--blue);border-color:var(--blue);}
.chip.approval-Pending{color:var(--amber);border-color:var(--amber);}
.chip.approval-Approved{color:var(--mint);border-color:var(--mint);}
.chip.approval-Rejected{color:var(--danger);border-color:var(--danger);}
.chip.chip-type{color:var(--teal);border-color:var(--teal);}
.chip.chip-name{color:var(--purple);border-color:var(--purple);}
.chip.chip-department{color:var(--rose);border-color:var(--rose);}
.approval-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.approval-hint{font-size:12px;color:var(--muted);font-style:italic;}
.btn-approve{background:var(--mint);color:#06231a;}
.btn-approve:hover{background:#38c290;}
.btn-reject{background:var(--danger);color:#2a0808;}
.btn-reject:hover{background:#e15a5a;}
.empty-col{color:var(--muted);font-size:12px;text-align:center;padding:30px 10px;font-style:italic;}

/* Journal */
.journal-wrap{max-width:720px;margin:0 auto;}
.day-group{margin-bottom:26px;}
.day-label{
  font-family:'IBM Plex Mono';font-size:12px;color:var(--amber);letter-spacing:1px;
  text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px dashed var(--border);
}
.entry{
  display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--panel-2);
}
.entry-time{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);min-width:52px;padding-top:2px;}
.entry-body{flex:1;font-size:13.5px;line-height:1.5;}
.entry-ticket-link{
  display:inline-block;font-family:'IBM Plex Mono';font-size:10.5px;background:var(--panel);
  border:1px solid var(--border);border-radius:5px;padding:2px 7px;color:var(--mint);margin-top:6px;cursor:pointer;
}
.entry-del{color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px;}
.entry-del:hover{color:var(--danger);}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state-icon{font-family:'IBM Plex Mono';font-size:30px;color:var(--border);margin-bottom:10px;}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(4,8,16,0.7);display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.overlay.show{display:flex;}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;
  width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
}
.modal h3{margin:0 0 18px;font-family:'IBM Plex Mono';font-size:15px;letter-spacing:0.5px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;font-family:'IBM Plex Mono';}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);
  padding:9px 11px;font-family:'IBM Plex Sans';font-size:13.5px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);}
.field-highlight{background:rgba(60,125,217,0.08);border:1px solid var(--blue);border-radius:8px;padding:10px 12px 4px;}
.field-highlight label{color:var(--blue);font-weight:700;}
.field textarea{resize:vertical;min-height:70px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

.loading{text-align:center;padding:60px;color:var(--muted);font-family:'IBM Plex Mono';font-size:13px;}

/* Lock screen */
.lock-overlay{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(rgba(8,20,35,0.6),rgba(8,20,35,0.6)),url('login-bg.jpg') center/cover no-repeat;padding:20px;
}
.lock-card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:36px 32px;width:100%;max-width:340px;text-align:center;
  box-shadow:0 10px 40px rgba(20,30,50,0.12);
}
.lock-card img{height:56px;margin-bottom:16px;}
.lock-card h2{margin:0 0 4px;font-family:'IBM Plex Mono';font-size:15px;letter-spacing:0.3px;}
.lock-card p{margin:0 0 22px;font-size:12px;color:var(--muted);font-family:'IBM Plex Mono';}
.pin-input{
  width:100%;text-align:center;letter-spacing:10px;font-size:22px;font-family:'IBM Plex Mono';
  background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:12px;color:var(--text);
  margin-bottom:14px;
}
.pin-input:focus{outline:none;border-color:var(--amber);}
.pin-error{color:var(--danger);font-size:12px;font-family:'IBM Plex Mono';margin-bottom:10px;min-height:16px;}
.lock-btn{
  width:100%;background:var(--amber);color:#2a1e05;border:none;border-radius:9px;
  padding:11px;font-family:'IBM Plex Mono';font-weight:600;font-size:13px;cursor:pointer;
}
.lock-btn:hover{background:#dbae44;}
.role-btn{
  width:100%;border:1px solid var(--border);border-radius:9px;padding:14px;
  font-family:'IBM Plex Mono';font-weight:600;font-size:13px;cursor:pointer;
  background:var(--panel-2);color:var(--text);margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.role-btn:hover{border-color:var(--amber);}
.role-btn.admin-role{background:var(--amber);color:#2a1e05;border-color:var(--amber);}
.role-btn.admin-role:hover{background:#dbae44;}
.role-btn.staff-role{background:var(--blue);color:#fff;border-color:var(--blue);}
.role-btn.staff-role:hover{background:#5a95e0;}
.back-link{
  display:inline-block;margin-top:14px;font-family:'IBM Plex Mono';font-size:11.5px;
  color:var(--muted);cursor:pointer;text-decoration:underline;
}
.back-link:hover{color:var(--text);}

/* Report */
.report-wrap{max-width:900px;margin:0 auto;}
.report-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
.month-input{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);
  padding:9px 14px;font-family:'IBM Plex Mono';font-size:13px;
}
.month-input:focus{outline:none;border-color:var(--amber);}
.report-sheet{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:32px;}
.report-head{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--amber);padding-bottom:18px;margin-bottom:22px;}
.report-head img{height:52px;width:auto;}
.report-head-text h2{margin:0;font-family:'IBM Plex Mono';font-size:18px;letter-spacing:0.5px;}
.report-head-text p{margin:4px 0 0;color:var(--muted);font-size:12.5px;font-family:'IBM Plex Mono';}
.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
@media(max-width:700px){.report-grid{grid-template-columns:1fr 1fr;}}
.report-card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:16px;text-align:center;}
.report-card .num{font-family:'IBM Plex Mono';font-size:26px;font-weight:700;}
.report-card .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
.report-section{margin-bottom:26px;}
.report-section h3{font-family:'IBM Plex Mono';font-size:13px;letter-spacing:0.8px;text-transform:uppercase;color:var(--amber);border-bottom:1px dashed var(--border);padding-bottom:8px;margin-bottom:12px;}
.breakdown-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;}
.breakdown-label{min-width:140px;color:var(--muted);font-family:'IBM Plex Mono';font-size:11.5px;}
.breakdown-bar-wrap{flex:1;background:var(--bg);border-radius:5px;overflow:hidden;height:10px;}
.breakdown-bar{height:100%;background:var(--amber);border-radius:5px;}
.breakdown-val{font-family:'IBM Plex Mono';font-size:12px;min-width:24px;text-align:right;}
table.report-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.report-table th{
  text-align:left;font-family:'IBM Plex Mono';font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;
  color:var(--muted);border-bottom:1px solid var(--border);padding:8px 10px;
}
table.report-table td{padding:9px 10px;border-bottom:1px solid var(--panel);vertical-align:top;}
table.report-table tr:last-child td{border-bottom:none;}
table.report-table thead tr{background:var(--panel);}
table.report-table tbody tr:nth-child(even){background:rgba(255,255,255,0.02);}
table.report-table tbody tr:hover{background:var(--panel);}
.report-empty{text-align:center;color:var(--muted);padding:40px;font-size:13px;}
.status-pie-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
.status-pie{width:140px;height:140px;border-radius:50%;flex-shrink:0;}
.status-legend{display:flex;flex-direction:column;gap:9px;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:13px;font-family:'IBM Plex Mono';min-width:160px;}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.legend-count{margin-left:auto;font-weight:600;}

@media print{
  body{background:#fff;color:#111;}
  .topbar,.report-toolbar,.bg-watermark{display:none !important;}
  .content{padding:0;}
  .report-sheet{background:#fff;border:none;color:#111;}
  .report-card,.breakdown-bar-wrap{background:#f2f2f2;}
  .report-card .lbl,.breakdown-label,.report-head-text p{color:#555;}
  table.report-table th{color:#555;border-color:#ddd;}
  table.report-table td{border-color:#eee;}
}
</style>

let firebaseReady = false;
let db = null;
try{
  if(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('PASTE_') !== 0 && typeof firebase !== 'undefined'){
    firebase.initializeApp(FIREBASE_CONFIG);      firebase.auth().signInAnonymously();

/* Unique id for this browser tab/session — used so a PC never "notifies itself". */
const CLIENT_ID = (function(){
  try{
    let id = sessionStorage.getItem('akit_client_id');
    if(!id){ id = uid()+uid(); sessionStorage.setItem('akit_client_id', id); }
    return id;
  }catch(e){ return uid()+uid(); }
})();

/* Portable storage: uses Firebase Realtime Database when configured (so every
   PC shares the same data), falls back to Claude's window.storage when available
   (in-app), and finally to localStorage when hosted standalone with no Firebase. */
const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(firebaseReady){
    try{
      const snap = await db.ref('akit/'+key).once('value');
      const v = snap.val();
      return (v !== null && v !== undefined) ? {key, value: v} : null;
    }catch(e){ console.error('Firebase read failed, falling back:', e); }
  }
  if(hasClaudeStorage){
    try{ return await window.storage.get(key, false); }catch(e){ return null; }
  }
  const v = localStorage.getItem('akit_'+key);
  return v !== null ? {key, value: v} : null;
}
async function storageSet(key, value){
  if(firebaseReady){
    try{ await db.ref('akit/'+key).set(value); return {key, value}; }
    catch(e){ console.error('Firebase write failed, falling back:', e); }
  }
  if(hasClaudeStorage){
    try{ return await window.storage.set(key, value, false); }catch(e){ return null; }
  }
  try{ localStorage.setItem('akit_'+key, value); return {key, value}; }
  catch(e){ return null; }
}

/* --- Live sync: any PC's changes reflect instantly on every other PC --- */
let liveSyncStarted = false;
function startLiveSync(){
  if(!firebaseReady || liveSyncStarted) return;
  liveSyncStarted = true;
  db.ref('akit/tickets').on('value', snap=>{
    const v = snap.val();
    if(v === null || v === undefined) return;
    try{ tickets = JSON.parse(v); render(); }catch(e){}
  });
  db.ref('akit/journal').on('value', snap=>{
    const v = snap.val();
    if(v === null || v === undefined) return;
    try{ journal = JSON.parse(v); render(); }catch(e){}
  });
}

/* --- Instant notification: staff submits a ticket -> every admin PC beeps + pops up --- */
function pushTicketNotification(ticketNo, name, problemType, priority){
  if(!firebaseReady) return;
  try{
    db.ref('akit/notifications').push({
      ticketNo, name, problemType, priority,
      clientId: CLIENT_ID,
      ts: firebase.database.ServerValue.TIMESTAMP
    });
  }catch(e){ console.error('Notification push failed:', e); }
}

let adminNotifStarted = false;
async function startAdminNotificationListener(){
  if(!firebaseReady || adminNotifStarted) return;
  adminNotifStarted = true;
  const notifRef = db.ref('akit/notifications');
  let baselineKey = null;
  try{
    const snap = await notifRef.orderByKey().limitToLast(1).once('value');
    snap.forEach(child=>{ baselineKey = child.key; });
  }catch(e){}
  notifRef.on('child_added', snap=>{
    if(baselineKey && snap.key <= baselineKey) return;
    const n = snap.val();
    if(!n || n.clientId === CLIENT_ID) return;
    playNotificationSound();
    showTicketPopup(n);
  });
}

function playNotificationSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const tone = (freq, start, dur)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime+start);
      g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime+start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
      o.start(ctx.currentTime+start);
      o.stop(ctx.currentTime+start+dur+0.05);
    };
    tone(880,0,0.16); tone(1108,0.18,0.16); tone(880,0.36,0.22);
  }catch(e){ console.error('Sound failed:', e); }
}

function getToastContainer(){
  let c = document.getElementById('akit-toast-container');
  if(!c){
    c = document.createElement('div');

async function loadData(){
  try{
    const t = await storageGet('tickets');
    tickets = t ? JSON.parse(t.value) : [];
  }catch(e){ tickets = []; }
  try{
    const j = await storageGet('journal');
    journal = j ? JSON.parse(j.value) : [];
  }catch(e){ journal = []; }
  try{
    const c = await storageGet('ticketCounter');
    ticketCounter = c ? JSON.parse(c.value) : (tickets.length+1);
  }catch(e){ ticketCounter = tickets.length+1; }
  try{
    const cm = await storageGet('ticketCounterMonth');
    ticketCounterMonth = cm ? JSON.parse(cm.value) : new Date().toISOString().slice(0,7);
  }catch(e){ ticketCounterMonth = new Date().toISOString().slice(0,7); }
  render();
  startLiveSync();
  startAdminNotificationListener();
}

async function saveTickets(){
  try{ await storageSet('tickets', JSON.stringify(tickets)); }
  catch(e){ console.error('Save failed', e); }
}
async function saveJournal(){
  try{ await storageSet('journal', JSON.stringify(journal)); }
  catch(e){ console.error('Save failed', e); }
}
async function saveCounter(){
  try{ await storageSet('ticketCounter', JSON.stringify(ticketCounter)); }
  catch(e){ console.error('Save failed', e); }
}
async function saveCounterMonth(){
  try{ await storageSet('ticketCounterMonth', JSON.stringify(ticketCounterMonth)); }
  catch(e){ console.error('Save failed', e); }
}
async function ensureTicketCounterFresh(){
  const currentMonth = new Date().toISOString().slice(0,7);
  if(ticketCounterMonth !== currentMonth){
    ticketCounter = 1;
    ticketCounterMonth = currentMonth;
    await saveCounterMonth();
  }
}

function fmtDate(d){
  return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtTime(d){
  return new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function dayKey(d){
  const dt = new Date(d);
  return dt.toISOString().slice(0,10);
}

function renderJournal(){
  const groups = {};
  journal.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(e=>{
    const k = dayKey(e.createdAt);
    if(!groups[k]) groups[k] = [];
    groups[k].push(e);
  });
  const keys = Object.keys(groups).sort((a,b)=> b.localeCompare(a));

  return `
    <div class="toolbar" style="max-width:720px;margin:0 auto 18px;">
      <div style="font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);">Daily work log</div>

    </div>

}

async function saveTicket(id){
  const name = document.getElementById('f-name').value.trim();
  const department = document.getElementById('f-department').value.trim();
  const jobDescription = document.getElementById('f-jobdesc').value.trim();
  if(!jobDescription){ alert('Job description is required'); return; }
  const problemType = document.getElementById('f-problemtype').value;
  const purchaseItems = document.getElementById('f-purchase').value.trim();
  const priority = document.getElementById('f-priority').value;
  const status = document.getElementById('f-status').value;
  const resolutionNotes = document.getElementById('f-resolution').value.trim();
  const title = jobDescription.length > 60 ? jobDescription.slice(0,60)+'…' : jobDescription;

  if(id){
    const t = tickets.find(x=>x.id===id);
    Object.assign(t,{name,department,jobDescription,problemType,purchaseItems,priority,status,resolutionNotes,title,updatedAt:Date.now()});
  } else {
    await ensureTicketCounterFresh();
    const ticketNo = 'ITK-' + String(ticketCounter).padStart(4,'0');
    ticketCounter++;
    tickets.push({id:uid(),ticketNo,name,department,jobDescription,problemType,purchaseItems,priority,status,resolutionNotes,approvalStatus:problemType==='Purchase Request'?'Pending':undefined,title,createdAt:Date.now(),updatedAt:Date.now()});
    await saveCounter();
  }
  await saveTickets();
  closeModal();
  render();
}

async function setApproval(id, decision){
  const t = tickets.find(x=>x.id===id);
  if(!t) return;
  t.approvalStatus = decision;
  t.status = decision==='Approved' ? 'In Progress' : 'Closed';
  t.updatedAt = Date.now();
  await saveTickets();
  closeModal();
  render();
}

  const statusTotal = monthTickets.length;

    statusAcc += pct;

    const pct = approvalTotal ? (count/approvalTotal*100) : 0;

  const sortedTickets = monthTickets.slice().sort((a,b)=>a.createdAt-b.createdAt);

          <div class="report-card"><div class="num" style="color:var(--mint)">${resolvedCount}</div><div class="lbl">Resolved / Closed</div></div>
          <div class="report-card"><div class="num" style="color:var(--amber)">${openCount}</div><div class="lbl">Still Open</div></div>
          <div class="report-card"><div class="num" style="color:var(--danger)">${criticalCount}</div><div class="lbl">Critical Priority</div></div>
        </div>

        ${monthTickets.length ? `
        <div class="report-section">
          <h3>Breakdown by Problem Type</h3>
          ${PROBLEM_TYPES.map(pt => `
            <div class="breakdown-row">
              <div class="breakdown-label">${pt}</div>
              <div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:${(byType[pt]/maxType*100)}%"></div></div>
              <div class="breakdown-val">${byType[pt]}</div>
            </div>
          `).join('')}
        </div>

        <div class="report-section">
          <h3>Breakdown by Department</h3>
          ${Object.keys(byDept).length ? Object.entries(byDept).sort((a,b)=>b[1]-a[1]).map(([dept,count]) => `
            <div class="breakdown-row">
              <div class="breakdown-label">${escapeHtml(dept)}</div>
              <div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:${(count/maxDept*100)}%"></div></div>
              <div class="breakdown-val">${count}</div>
            </div>
          `).join('') : `<div class="report-empty">No department data</div>`}
        </div>

        <div class="report-section">
          <h3>Tickets by Status</h3>
          ${monthTickets.length ? `
          <div class="status-pie-wrap">
            <div class="status-pie" style="background:conic-gradient(${statusGradient});"></div>
            <div class="status-legend">
              ${Object.entries(byStatus).map(([s,count])=>`
                <div class="legend-row"><span class="legend-dot" style="background:${STATUS_COLORS[s]}"></span>${s}<span class="legend-count">${count}</span></div>
              `).join('')}
            </div>
          </div>
          ` : `<div class="report-empty">No ticket data</div>`}
        </div>

        <div class="report-section">
          <h3>Purchase Approval Status</h3>
          ${purchaseTickets.length ? `
          <div class="status-pie-wrap">
            <div class="status-pie" style="background:conic-gradient(${approvalGradient});"></div>
            <div class="status-legend">
              ${Object.entries(byApproval).map(([s,count])=>`
                <div class="legend-row"><span class="legend-dot" style="background:${APPROVAL_COLORS[s]}"></span>${s}<span class="legend-count">${count}</span></div>
              `).join('')}
            </div>
          </div>
          ` : `<div class="report-empty">No purchase requests this month</div>`}
        </div>

        <div class="report-section">
          <h3>Ticket Log (${sortedTickets.length}) — sorted by date</h3>
          <table class="report-table">
            <thead><tr><th>Ticket</th><th>Name</th><th>Dept</th><th>Type</th><th>Description</th><th>Priority</th><th>Status</th><th>Approval</th><th>Date</th><th>Resolution</th></tr></thead>
            <tbody>
              ${sortedTickets.map(t=>`
                <tr>
                  <td>${t.ticketNo}</td>
                  <td>${escapeHtml(t.name||'—')}</td>
                  <td>${escapeHtml(t.department||'—')}</td>
                  <td>${t.problemType}</td>
                  <td>${escapeHtml(t.jobDescription||'—')}</td>
                  <td>${t.priority}</td>
                  <td>${t.status}</td>
                  <td>${t.problemType==='Purchase Request' ? (t.approvalStatus||'Pending') : '—'}</td>
                  <td>${fmtDate(t.createdAt)}</td>
                  <td>${escapeHtml(t.resolutionNotes||'—')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>

        <div class="report-section">
          <h3>Daily Work Log Entries (${monthEntries.length})</h3>
          ${monthEntries.length ? `
          <table class="report-table">
            <thead><tr><th>Date</th><th>Time</th><th>Note</th><th>Ticket</th></tr></thead>
            <tbody>
              ${monthEntries.slice().sort((a,b)=>a.createdAt-b.createdAt).map(e=>{
                const t = e.ticketId ? tickets.find(x=>x.id===e.ticketId) : null;
                return `<tr>
                  <td>${fmtDate(e.createdAt)}</td>
                  <td>${fmtTime(e.createdAt)}</td>
                  <td>${escapeHtml(e.note)}</td>
                  <td>${t ? t.ticketNo : '—'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>` : `<div class="report-empty">No journal entries logged this month</div>`}
        </div>
        ` : `<div class="report-empty">No tickets logged for ${monthLabel}</div>`}
      </div>
    </div>
  `;
}

function setReportMonth(v){ reportMonth = v; render(); }
window.setReportMonth = setReportMonth;
window.setTab = setTab;
window.onSearch = onSearch;
window.openTicketModal = openTicketModal;
window.openTicketDetail = openTicketDetail;
window.saveTicket = saveTicket;
window.deleteTicket = deleteTicket;
window.closeModal = closeModal;
window.openJournalModal = openJournalModal;
window.saveEntry = saveEntry;
window.deleteEntry = deleteEntry;

/* --- PIN lock gate --- */
let ACCESS_PIN_ADMIN = '0786';
let ACCESS_PIN_STAFF = '123';
let pinsLoaded = false;

async function loadPins(){
  if(pinsLoaded) return;
  try{
    const a = await storageGet('pin_admin');
    if(a && a.value) ACCESS_PIN_ADMIN = JSON.parse(a.value);
  }catch(e){}
  try{
    const s = await storageGet('pin_staff');
    if(s && s.value) ACCESS_PIN_STAFF = JSON.parse(s.value);
  }catch(e){}
  pinsLoaded = true;
}

let pendingRole = null;

function renderLock(){
  APP.innerHTML = `
    <div class="lock-overlay">
      <div class="lock-card">
        <img src="${LOGO_SRC}" alt="Al Khayyal Group logo">
        <h2>Al Khayyal Group Trading &amp; Investment</h2>
        <p>Select login type to continue</p>
        <button class="role-btn admin-role" onclick="chooseRole('admin')">🛡️ Admin Login</button>
        <button class="role-btn staff-role" onclick="chooseRole('staff')">👤 Staff Login</button>
      </div>
    </div>
  `;
}

function chooseRole(role){
  pendingRole = role;
  renderPinScreen();
}
window.chooseRole = chooseRole;

function renderPinScreen(errorMsg){
  const label = pendingRole === 'admin' ? 'Admin Login' : 'Staff Login';
  APP.innerHTML = `
    <div class="lock-overlay">
      <div class="lock-card">
        <img src="${LOGO_SRC}" alt="Al Khayyal Group logo">
        <h2>Al Khayyal Group Trading &amp; Investment</h2>
        <p>${label} — enter your PIN</p>
        <input id="pin-field" class="pin-input" type="password" inputmode="numeric" maxlength="4" autofocus>
        <div class="pin-error">${errorMsg || ''}</div>
        <button class="lock-btn" onclick="checkPin()">Unlock</button>
        <div class="back-link" onclick="renderLock()">← Back</div>
      </div>
    </div>
  `;
  const field = document.getElementById('pin-field');
  field.focus();
  field.addEventListener('keydown', e => { if(e.key === 'Enter') checkPin(); });
}

async function checkPin(){
  await loadPins();
  const val = document.getElementById('pin-field').value.trim();
  if(pendingRole === 'admin' && val === ACCESS_PIN_ADMIN){
    try{ sessionStorage.setItem('akit_unlocked', 'true'); sessionStorage.setItem('akit_role', 'admin'); }catch(e){}
    try{ if('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }catch(e){}
    loadData();
  } else if(pendingRole === 'staff' && val === ACCESS_PIN_STAFF){
    try{ sessionStorage.setItem('akit_unlocked', 'true'); sessionStorage.setItem('akit_role', 'staff'); }catch(e){}
    loadStaffData();
  } else {
    renderPinScreen('Incorrect PIN, please try again.');
  }
}
window.checkPin = checkPin;

function lockApp(){
  try{ sessionStorage.removeItem('akit_unlocked'); sessionStorage.removeItem('akit_role'); }catch(e){}
  renderLock();
}
window.lockApp = lockApp;

/* --- Staff mode: simple ticket submission only --- */
async function loadStaffData(){
  try{
    const t = await storageGet('tickets');
    tickets = t ? JSON.parse(t.value) : [];
  }catch(e){ tickets = []; }
  try{
    const c = await storageGet('ticketCounter');
    ticketCounter = c ? JSON.parse(c.value) : (tickets.length+1);
  }catch(e){ ticketCounter = tickets.length+1; }
  try{
    const cm = await storageGet('ticketCounterMonth');
    ticketCounterMonth = cm ? JSON.parse(cm.value) : new Date().toISOString().slice(0,7);
  }catch(e){ ticketCounterMonth = new Date().toISOString().slice(0,7); }
  window.__lastStaffTicketNo = null;
  renderStaffApp();
}

function renderStaffApp(){
  const justSubmitted = window.__lastStaffTicketNo;
  APP.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <img src="${LOGO_SRC}" class="header-logo" alt="Al Khayyal Group logo">
        <div>
          <div class="brand-name">Al Khayyal Group Trading & Investment</div>
          <div class="brand-sub">STAFF TICKET SUBMISSION</div>
          <div class="brand-sub" style="margin-top:1px;">IT Support: Muhammad Abdullah</div>
        </div>
      </div>
      <div class="stats">
        <button class="btn btn-ghost" style="align-self:center;" onclick="lockApp()" title="Lock this session">🔒 Lock</button>
      </div>
    </div>
    <div class="content">
      <div class="report-sheet" style="max-width:520px;margin:30px auto;">
        <h3 style="margin-top:0;font-family:'IBM Plex Mono';">Submit a New Ticket</h3>
        ${justSubmitted ? `<div style="background:var(--panel);border:1px solid var(--mint);color:var(--mint);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-family:'IBM Plex Mono';font-size:13px;">✓ Thank you! Your ticket has been submitted successfully. Admin will review it shortly.</div>` : ''}
        <div class="field field-highlight">
          <label>Staff Name</label>
          <input id="s-name" placeholder="Your name">
        </div>
        <div class="field">
          <label>Department</label>
          <select id="s-department"><option value="">Select department</option><option>Audit</option><option>CEO Office</option><option>Corporate Support</option><option>Facility Management</option><option>Finance</option><option>Legal</option><option>Procurement</option><option>Property Management</option><option>Quality</option></select>
        </div>
        <div class="field">
          <label>Issue Type</label>
          <select id="s-problemtype">
            ${PROBLEM_TYPES.map(p=>`<option>${p}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Issue Details</label>
          <textarea id="s-jobdesc" placeholder="Briefly describe the issue..."></textarea>
        </div>
        <div class="modal-actions" style="justify-content:flex-end;">
          <button class="btn btn-primary" onclick="submitStaffTicket()">Submit Ticket</button>
        </div>
      </div>
    </div>
  `;
}

async function submitStaffTicket(){
  const name = document.getElementById('s-name').value.trim();
  const department = document.getElementById('s-department').value.trim();
  const problemType = document.getElementById('s-problemtype').value;
  const jobDescription = document.getElementById('s-jobdesc').value.trim();
  if(!name){ alert('Please enter your name'); return; }
  if(!jobDescription){ alert('Please describe the issue'); return; }
  const title = jobDescription.length > 60 ? jobDescription.slice(0,60)+'…' : jobDescription;
  await ensureTicketCounterFresh();
  const ticketNo = 'ITK-' + String(ticketCounter).padStart(4,'0');
  ticketCounter++;
  tickets.push({id:uid(),ticketNo,name,department,jobDescription,problemType,purchaseItems:'',resolutionNotes:'',approvalStatus:problemType==='Purchase Request'?'Pending':undefined,priority:'Medium',status:'Open',title,createdAt:Date.now(),updatedAt:Date.now()});
  await saveCounter();
  await saveTickets();
  pushTicketNotification(ticketNo, name, problemType, 'Medium');
  window.__lastStaffTicketNo = ticketNo;
  renderStaffApp();
}
window.submitStaffTicket = submitStaffTicket;
window.loadStaffData = loadStaffData;

let alreadyUnlocked = false;
let savedRole = 'admin';
try{
  alreadyUnlocked = sessionStorage.getItem('akit_unlocked') === 'true';
  savedRole = sessionStorage.getItem('akit_role') || 'admin';
}catch(e){}

if(alreadyUnlocked){
  if(savedRole === 'staff') loadStaffData();
  else loadData();
} else {
  renderLock();
}
</script>
